
name: Actualizar resultados de la liga

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el bot
        run: python main.py

      - name: Guardar los resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-de-la-liga
          path: resultados/
          if-no-files-found: warn
          retention-days: 30
